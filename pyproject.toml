[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-ai"
version = "0.0.1"
description = "Safety-first modular market-data and backtesting engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ramknot" }]
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pandas>=2.2,<3",
  "pandas-market-calendars>=4.4,<6",
  "pyarrow>=15,<24",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.30,<1",
  "yfinance>=0.2.54,<0.3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0,<9.0",
]

[project.scripts]
trading-ai = "trading_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trading_ai.monitoring" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: opt-in tests that require an external network provider",
]
filterwarnings = [
  "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
]
