version = "1.0"

# Read-only research ranges.  Nothing here subscribes to a service or selects
# a deployment provider.  Monthly amounts are scenario estimates in USD.

[scenarios.LOCAL_PC]
deployment_mode = "LOCAL_PC"

[scenarios.LOCAL_PC.components.market_data_subscription]
status = "ESTIMATED_CONSERVATIVE"
currency = "USD"
monthly_low = "10"
monthly_central = "25"
monthly_high = "100"
source_type = "CURRENT_OFFICIAL_SOURCE"
source_reference = "https://portal.interactivebrokers.com/en/pricing/market-data-pricing.php"
notes = "Range covers current US snapshot/non-consolidated and possible Euronext display needs; entitlement and professional status can change the actual amount."

[scenarios.LOCAL_PC.components.server_vps]
status = "VERIFIED"
currency = "USD"
monthly_low = "0"
monthly_central = "0"
monthly_high = "0"
source_type = "ESTIMATE"
source_reference = "LOCAL_PC"
notes = "No VPS is used in the local-PC scenario."

[scenarios.LOCAL_PC.components.software_subscription]
status = "VERIFIED"
currency = "USD"
monthly_low = "0"
monthly_central = "0"
monthly_high = "0"
source_type = "ESTIMATE"
source_reference = "PROJECT_DEPENDENCY_MANIFEST"
notes = "The repository declares no mandatory paid software subscription."

[scenarios.LOCAL_PC.components.other_fixed_cost]
status = "ESTIMATED_CONSERVATIVE"
currency = "USD"
monthly_low = "0"
monthly_central = "5"
monthly_high = "25"
source_type = "ESTIMATE"
source_reference = "RESEARCH_SCENARIO_ASSUMPTION"
notes = "Electricity and hardware amortisation are estimates, not observed invoices."

